name: build exe

on:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 安装依赖
        run: npm install

      - name: 打包 EXE
        run: npm run dist

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/*.exe
